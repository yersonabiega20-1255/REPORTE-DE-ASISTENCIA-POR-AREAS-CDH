<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de asistencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #17212b;
    --tinta-suave: #55626e;
    --superficie: #ffffff;
    --linea: #c3ccd4;
    --azul: #1f3a52;      /* azul pizarra */
    --naranja: #7b8a98;   /* gris acero */
    --entrada: #2f5d50;
    --salida: #2f4a6b;
    --aviso: #8a5200;
    --error: #b3261e;
    --fuente-titulo: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
    --fuente-texto: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(160deg, #e8edf1 0%, #d6dde4 55%, #c4cdd6 100%) fixed;
    color: var(--tinta);
    font-family: var(--fuente-texto);
    font-size: 18px;
    line-height: 1.4;
    display: flex;
    justify-content: center;
    padding: 24px 16px 32px;
  }
  main { width: 100%; max-width: 470px; position: relative; }

  /* ---------- Fondo decorativo (formas con sombras geométricas) ---------- */
  .fondo { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
  .fondo > * { position: absolute; }
  .anillo { border-radius: 50%; border: 2px solid rgba(31, 58, 82, .10); }
  .anillo.a1 { width: 58vmin;  height: 58vmin;  top: -22vmin; left: -22vmin; }
  .anillo.a2 { width: 84vmin;  height: 84vmin;  top: -35vmin; left: -35vmin; border-color: rgba(31, 58, 82, .07); }
  .anillo.a3 { width: 112vmin; height: 112vmin; top: -49vmin; left: -49vmin; border-color: rgba(31, 58, 82, .04); }
  .disco { width: 62vmin; height: 62vmin; right: -22vmin; bottom: -24vmin; border-radius: 50%;
    background: rgba(31, 58, 82, .08); box-shadow: 0 30px 60px rgba(15, 25, 40, .22); }
  .anillo.n1 { width: 88vmin; height: 88vmin; right: -35vmin; bottom: -37vmin; border-color: rgba(31, 58, 82, .12); }
  .banda { top: -12vh; right: 16vw; width: 15vmin; height: 135vh; transform: rotate(24deg);
    background: linear-gradient(90deg, rgba(31, 58, 82, .10), rgba(31, 58, 82, .03));
    box-shadow: -18px 0 40px rgba(15, 25, 40, .18), 18px 0 40px rgba(15, 25, 40, .10); }
  .banda.b2 { right: 6vw; width: 5vmin; background: rgba(31, 58, 82, .08); }
  .puntos { width: 30vmin; height: 20vmin; opacity: .6;
    background-image: radial-gradient(rgba(31, 58, 82, .30) 2px, transparent 2.5px);
    background-size: 20px 20px; }
  .puntos.p1 { top: 9vh; right: 5vw; }
  .puntos.p2 { bottom: 7vh; left: 4vw; }
  .cuadro { width: 9vmin; height: 9vmin; right: 12vw; top: 44vh; border-radius: 4px; transform: rotate(22deg);
    background: rgba(31, 58, 82, .10);
    box-shadow: 14px 14px 28px rgba(15, 25, 40, .25), -6px -6px 16px rgba(255, 255, 255, .5); }
  .rombo { width: 6vmin; height: 6vmin; left: 9vw; top: 52vh; border-radius: 3px; transform: rotate(45deg);
    background: rgba(31, 58, 82, .12);
    box-shadow: 10px 10px 22px rgba(15, 25, 40, .22); }

  /* ---------- Encabezado ---------- */
  .logo {
    display: block;
    width: 112px;
    height: auto;
    margin: 0 auto 6px;
    mix-blend-mode: multiply; /* el fondo blanco del logo se funde con el degradado */
  }
  .bienvenida { text-align: center; padding: 2px 0 20px; }
  .bienvenida h1 {
    margin: 0;
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: clamp(44px, 14vw, 60px);
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--azul);
  }
  .detalle-marca {
    width: 64px; height: 5px; margin: 12px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--azul) 0 50%, var(--naranja) 50% 100%);
  }
  .subtitulo { margin: 0; font-size: 20px; font-weight: 500; }
  .reloj-mini { margin-top: 10px; color: var(--tinta-suave); font-size: 16px; }
  .reloj-mini .hora {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: 26px;
    color: var(--tinta);
    font-variant-numeric: tabular-nums;
  }
  .fecha { display: block; }
  .fecha::first-letter { text-transform: uppercase; }

  /* ---------- Panel principal ---------- */
  .panel {
    background: var(--superficie);
    border: 1px solid var(--linea);
    border-top: 5px solid var(--azul);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 12px 12px 0 rgba(31, 58, 82, .14);
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  .opcional { font-weight: 400; color: var(--tinta-suave); font-size: 15px; }
  input[type="text"], textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 2px solid var(--linea);
    border-radius: 10px;
    padding: 12px 14px;
  }
  #dni {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    text-align: center;
    font-size: 36px;
    letter-spacing: 0.18em;
    padding: 10px 14px;
  }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid #f2b705;
    outline-offset: 2px;
  }
  #dni:focus, textarea:focus { border-color: var(--tinta); }

  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  button.marca {
    font-family: var(--fuente-titulo);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.1;
    color: #fff;
    border: 0;
    border-radius: 14px;
    min-height: 92px;
    padding: 12px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 6px 14px rgba(23, 33, 43, .18);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button.entrada { background: linear-gradient(160deg, #3a7262, var(--entrada)); }
  button.salida  { background: linear-gradient(160deg, #3d5c82, var(--salida)); }
  button.marca:active { transform: translateY(2px) scale(0.985); box-shadow: 0 2px 6px rgba(23, 33, 43, .2); }
  button.marca:disabled { opacity: 0.55; cursor: wait; }
  .etiqueta-obs { margin-top: 18px; }
  textarea { min-height: 80px; resize: vertical; }

  .pie { margin-top: 14px; text-align: center; }
  .enlace {
    font: inherit; font-size: 15px;
    background: none; border: 0; color: var(--tinta-suave);
    text-decoration: underline; cursor: pointer; padding: 6px 10px;
  }

  /* ---------- Confirmación a pantalla completa ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(14, 24, 34, .62);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: aparecer .18s ease-out;
  }
  .tarjeta {
    --acento: var(--entrada);
    position: relative;
    width: 100%; max-width: 420px;
    background: #fff;
    border-radius: 24px;
    padding: 30px 24px 26px;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    animation: emerger .28s cubic-bezier(.2, .9, .3, 1.2);
  }
  .tarjeta::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: var(--acento); }
  .tarjeta.ok-entrada { --acento: var(--entrada); }
  .tarjeta.ok-salida  { --acento: var(--salida); }
  .tarjeta.info       { --acento: var(--aviso); }
  .tarjeta.error      { --acento: var(--error); }

  .icono {
    width: 92px; height: 92px; margin: 0 auto 14px;
    border-radius: 50%;
    background: var(--acento);
    display: flex; align-items: center; justify-content: center;
  }
  .icono svg { width: 52px; height: 52px; display: none; fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .tarjeta.ok-entrada .i-check, .tarjeta.ok-salida .i-check { display: block; }
  .tarjeta.info .i-info { display: block; }
  .tarjeta.error .i-error { display: block; }
  .i-check path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: trazo .45s .15s ease-out forwards; }

  .saludo { margin: 0; font-size: 19px; font-weight: 600; color: var(--acento); text-transform: uppercase; letter-spacing: .08em; }
  .nombre { margin: 4px 0 0; font-family: var(--fuente-titulo); font-weight: 700; font-size: 32px; line-height: 1.1; }
  .meta { margin: 6px 0 0; color: var(--tinta-suave); font-size: 18px; }
  .etiqueta-hora { margin: 16px 0 0; font-size: 15px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .08em; }
  .hora-grande {
    font-family: var(--fuente-titulo); font-weight: 700; font-size: 68px; line-height: 1.05;
    color: var(--acento); font-variant-numeric: tabular-nums;
  }
  .mensaje { margin: 6px 0 0; font-size: 21px; font-weight: 600; }
  .tarjeta.error .mensaje, .tarjeta.info .mensaje { font-size: 22px; }
  .extra { margin: 6px 0 0; color: var(--tinta-suave); }
  .cerrar {
    margin-top: 20px; font-family: var(--fuente-titulo); font-weight: 700; font-size: 20px;
    color: #fff; background: var(--acento); border: 0; border-radius: 12px; padding: 12px 36px; cursor: pointer;
  }
  .barra { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(0, 0, 0, .06); }
  .barra span { display: block; height: 100%; width: 100%; background: var(--acento); transform-origin: left; animation: vaciar linear forwards; }

  @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
  @keyframes emerger { from { opacity: 0; transform: translateY(18px) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes trazo { to { stroke-dashoffset: 0; } }
  @keyframes vaciar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  @media (prefers-reduced-motion: reduce) {
    .overlay, .tarjeta, .i-check path, .barra span { animation: none; }
    .i-check path { stroke-dashoffset: 0; }
    button.marca:active { transform: none; }
  }
  @media (max-width: 360px) { button.marca { font-size: 20px; } #dni { font-size: 30px; } .hora-grande { font-size: 56px; } }
</style>
</head>

<div class="fondo" aria-hidden="true">
  <div class="anillo a1"></div><div class="anillo a2"></div><div class="anillo a3"></div>
  <div class="disco"></div><div class="anillo n1"></div>
  <div class="banda"></div><div class="banda b2"></div>
  <div class="puntos p1"></div><div class="puntos p2"></div>
  <div class="cuadro"></div><div class="rombo"></div>
</div>

<script>
  /* ==== CONFIGURACIÓN: pega aquí la URL de tu aplicación web de Apps Script (termina en /exec) ==== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbxndLPa6tCqbrVa5uVPmXFhSDqWdtFoK5I1rGuqNFAmASWhrlUrF89pIO6P1PYcRRdh/exec';
  /* ============================================================================================== */
  const ZONA = 'America/Lima';
  const SEGUNDOS_OK = 6;
  const SEGUNDOS_AVISO = 6;
  const SEGUNDOS_ERROR = 5;

  const $ = function (id) { return document.getElementById(id); };
  const elDni = $('dni'), elObs = $('obs');
  const btnEntrada = $('btnEntrada'), btnSalida = $('btnSalida');
  const overlay = $('overlay'), tarjeta = $('tarjeta');
  let desfase = 0;
  let temporizador = null;
  let sonidoActivo = true;
  let audio = null;

  /* ---------- Reloj sincronizado con el servidor ---------- */
  function apiOk() { return API_URL.indexOf('/exec') > 0 && API_URL.indexOf('PEGA_AQUI') < 0; }
  if (apiOk()) {
    fetch(API_URL + '?accion=hora').then(function (r) { return r.json(); })
      .then(function (j) { desfase = j.ahora - Date.now(); })
      .catch(function () { /* se usa la hora del dispositivo solo para mostrar el reloj */ });
  }

  function actualizarReloj() {
    const ahora = new Date(Date.now() + desfase);
    $('hora').textContent = ahora.toLocaleTimeString('es-PE', {
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: ZONA
    });
    $('fecha').textContent = ahora.toLocaleDateString('es-PE', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: ZONA
    });
  }
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  /* ---------- Campos ---------- */
  elDni.addEventListener('input', function () { elDni.value = elDni.value.replace(/\D/g, '').slice(0, 8); });
  btnEntrada.addEventListener('click', function () { marcar('entrada'); });
  btnSalida.addEventListener('click', function () { marcar('salida'); });
  $('ovCerrar').addEventListener('click', cerrar);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) cerrar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) cerrar(); });
  $('btnSonido').addEventListener('click', function () {
    sonidoActivo = !sonidoActivo;
    $('btnSonido').textContent = 'Sonido: ' + (sonidoActivo ? 'activado' : 'desactivado');
    if (sonidoActivo) { prepararAudio(); sonar('info'); }
  });

  function bloquear(estado) { btnEntrada.disabled = estado; btnSalida.disabled = estado; }

  function marcar(tipo) {
    prepararAudio();
    const dni = elDni.value.replace(/\D/g, '');
    if (dni.length !== 8) {
      mostrar({ nivel: 'error', mensaje: 'Escribe tu DNI de 8 dígitos.' });
      return;
    }
    bloquear(true);
    if (!apiOk()) { bloquear(false); mostrar({ nivel: 'error', mensaje: 'Falta configurar la URL del servidor (API_URL en index.html).' }); return; }
    /* text/plain evita la comprobación previa (CORS) que Apps Script no admite */
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                     body: JSON.stringify({ accion: 'marcar', dni: dni, tipo: tipo, obs: elObs.value }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        bloquear(false);
        mostrar(r);
        if (r.nivel !== 'error') { limpiarCampos(); }
      })
      .catch(function () {
        bloquear(false);
        mostrar({ nivel: 'error', mensaje: 'No se pudo registrar. Revisa tu conexión e inténtalo de nuevo.' });
      });
  }

  function limpiarCampos() { elDni.value = ''; elObs.value = ''; }

  /* ---------- Confirmación a pantalla completa ---------- */
  function texto(el, valor) { el.textContent = valor || ''; el.hidden = !valor; }

  function saludo(r) {
    if (r.nivel === 'error') return 'Atención';
    if (r.nivel === 'info') return 'Aviso';
    if (r.tipo === 'salida') return 'Hasta pronto';
    const h = parseInt((r.hora || '0').split(':')[0], 10);
    return h < 12 ? 'Buenos días' : (h < 19 ? 'Buenas tardes' : 'Buenas noches');
  }

  function duracion(horas) {
    const h = Math.floor(horas);
    const m = Math.round((horas - h) * 60);
    return (h ? h + ' h ' : '') + m + ' min';
  }

  function mostrar(r) {
    clearTimeout(temporizador);
    const clase = r.nivel === 'ok' ? (r.tipo === 'salida' ? 'ok-salida' : 'ok-entrada') : r.nivel;
    tarjeta.className = 'tarjeta ' + clase;

    texto($('ovSaludo'), saludo(r));
    texto($('ovNombre'), r.nombre);
    texto($('ovMeta'), r.area);
    texto($('ovEtiqueta'), r.hora ? (r.nivel === 'ok' ? 'Hora registrada' : 'Marcada a las') : '');
    texto($('ovHora'), r.hora);
    texto($('ovMensaje'), r.mensaje);

    let extra = '';
    if (r.nivel === 'ok' && r.horas) { extra = 'Tiempo trabajado en este tramo: ' + duracion(r.horas); }
    if (r.nivel === 'ok' && r.ausencia) {
      extra += (extra ? '. ' : '') + 'Tienes una ausencia programada hoy (' + r.ausencia + '). Se dejó constancia.';
    }
    texto($('ovExtra'), extra);

    const segundos = r.nivel === 'error' ? SEGUNDOS_ERROR : (r.nivel === 'info' ? SEGUNDOS_AVISO : SEGUNDOS_OK);
    const barra = $('ovBarra');
    barra.style.animation = 'none';
    void barra.offsetWidth;
    barra.style.animation = '';
    barra.style.animationDuration = segundos + 's';

    overlay.hidden = false;
    $('ovCerrar').focus();
    sonar(r.nivel === 'ok' ? (r.tipo === 'salida' ? 'salida' : 'entrada') : r.nivel);
    try { if (navigator.vibrate) navigator.vibrate(r.nivel === 'error' ? [220] : [90]); } catch (e) {}
    temporizador = setTimeout(cerrar, segundos * 1000);
  }

  function cerrar() {
    clearTimeout(temporizador);
    overlay.hidden = true;
    elDni.focus();
  }

  /* ---------- Sonido (sin archivos: se genera en el momento) ---------- */
  function prepararAudio() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }

  function sonar(tipo) {
    if (!sonidoActivo || !audio) return;
    const notas = {
      entrada: [[523, 0, .13], [784, .15, .22]],
      salida:  [[660, 0, .13], [494, .15, .22]],
      info:    [[440, 0, .2]],
      error:   [[200, 0, .32]]
    }[tipo] || [[440, 0, .2]];
    try {
      const t0 = audio.currentTime;
      notas.forEach(function (n) {
        const osc = audio.createOscillator(), g = audio.createGain();
        osc.type = 'sine'; osc.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t0 + n[1]);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + n[1] + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
        osc.connect(g); g.connect(audio.destination);
        osc.start(t0 + n[1]); osc.stop(t0 + n[1] + n[2] + 0.03);
      });
    } catch (e) {}
  }
</script>
